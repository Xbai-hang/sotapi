<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="light-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>

    <!-- Card Shadow Filter -->
    <filter id="soft-shadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>

    <!-- Arrowhead Markers -->
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0969da"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-sky" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0284c7"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>

  <!-- 1. Background Fill & Grid -->
  <rect width="100%" height="100%" rx="14" fill="#ffffff"/>
  <rect width="100%" height="100%" rx="14" fill="url(#light-grid)"/>

  <!-- Border Outline -->
  <rect x="1.5" y="1.5" width="997" height="627" rx="14" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title Block -->
  <g transform="translate(40, 28)">
    <text x="0" y="20" fill="#0f172a" font-size="16" font-weight="700" letter-spacing="0.3">SotAPI Request Lifecycle</text>
  </g>

  <!-- 2. Lifelines (Vertical Subtle Dashed Lines) -->
  <line x1="125" y1="126" x2="125" y2="560" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="375" y1="126" x2="375" y2="560" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="625" y1="126" x2="625" y2="560" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="875" y1="126" x2="875" y2="560" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- 3. Activation Bars -->
  <!-- SotAPI Gateway Active -->
  <rect x="369.5" y="160" width="11" height="310" rx="3" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <!-- Telegram Bot Active -->
  <rect x="619.5" y="210" width="11" height="195" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Human Active -->
  <rect x="869.5" y="260" width="11" height="95" rx="3" fill="#dcfce7" stroke="#10b981" stroke-width="1.5"/>

  <!-- 4. Alt / Fallback Frame (Refined Cool Slate Theme) -->
  <g>
    <!-- Frame Box -->
    <rect x="280" y="486" width="680" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3"/>
    
    <!-- Alt Tab -->
    <rect x="280" y="486" width="44" height="20" rx="6" fill="#475569"/>
    <text x="302" y="500" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">alt</text>
    <text x="334" y="500" fill="#334155" font-size="10" font-weight="700">[能工智人处于离线状态]</text>
    
    <!-- Fallback Flow inside Frame -->
    <line x1="380" y1="524" x2="515" y2="524" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
    <text x="448" y="516" fill="#475569" font-size="9" font-weight="600" text-anchor="middle">触发 Fallback</text>

    <!-- Upstream LLM Tag -->
    <rect x="520" y="510" width="165" height="26" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <text x="602" y="527" fill="#1e293b" font-size="9.5" font-weight="700" text-anchor="middle">上游真实 LLM / 模板</text>

    <line x1="690" y1="524" x2="825" y2="524" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-slate)"/>
    <text x="835" y="527" fill="#475569" font-size="9" font-weight="500">无缝兜底并返回客户端</text>
  </g>

  <!-- 5. Messages (Horizontal Arrows) -->

  <!-- Message 1: Client -> SotAPI -->
  <g>
    <circle cx="145" cy="160" r="9" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
    <text x="145" y="163.5" fill="#0969da" font-size="9.5" font-weight="700" text-anchor="middle">1</text>
    <line x1="159" y1="160" x2="369.5" y2="160" stroke="#0969da" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="264" y="148" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">POST /v1/chat/completions</text>
    <text x="264" y="176" fill="#64748b" font-size="9" text-anchor="middle">OpenAI 格式请求 (带 API Key &amp; 上下文)</text>
  </g>

  <!-- Message 2: SotAPI -> Telegram -->
  <g>
    <circle cx="400" cy="210" r="9" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="400" y="213.5" fill="#4f46e5" font-size="9.5" font-weight="700" text-anchor="middle">2</text>
    <line x1="414" y1="210" x2="619.5" y2="210" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrow-indigo)"/>
    <text x="517" y="198" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">推送任务与上下文 (sendMessage)</text>
    <text x="517" y="226" fill="#64748b" font-size="9" text-anchor="middle">投递到配置的 Telegram 会话 / 群组</text>
  </g>

  <!-- Message 3: Telegram -> Human -->
  <g>
    <circle cx="650" cy="260" r="9" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="650" y="263.5" fill="#0284c7" font-size="9.5" font-weight="700" text-anchor="middle">3</text>
    <line x1="664" y1="260" x2="869.5" y2="260" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-sky)"/>
    <text x="767" y="248" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">展示对话消息与通知</text>
    <text x="767" y="276" fill="#64748b" font-size="9" text-anchor="middle">能工智人收到 Bot 任务消息</text>
  </g>

  <!-- Message 4: Human -> Telegram (Reply) -->
  <g>
    <circle cx="850" cy="325" r="9" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="850" y="328.5" fill="#059669" font-size="9.5" font-weight="700" text-anchor="middle">4</text>
    <line x1="836" y1="325" x2="630.5" y2="325" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
    <text x="735" y="313" fill="#059669" font-size="11" font-weight="700" text-anchor="middle">使用「回复 (Reply)」功能应答</text>
    <text x="735" y="341" fill="#047857" font-size="9" font-weight="500" text-anchor="middle">直接在聊天框引用回复即可</text>
  </g>

  <!-- Message 5: Telegram -> SotAPI -->
  <g>
    <circle cx="605" cy="380" r="9" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="605" y="383.5" fill="#0284c7" font-size="9.5" font-weight="700" text-anchor="middle">5</text>
    <line x1="591" y1="380" x2="380.5" y2="380" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow-sky)"/>
    <text x="486" y="368" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">回传能工智人回复内容</text>
    <text x="486" y="396" fill="#64748b" font-size="9" text-anchor="middle">通过 Webhook 回调 或 Polling 轮询拉取</text>
  </g>

  <!-- Message 6: SotAPI -> Client (Response) -->
  <g>
    <circle cx="350" cy="445" r="9" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
    <text x="350" y="448.5" fill="#0969da" font-size="9.5" font-weight="700" text-anchor="middle">6</text>
    <line x1="336" y1="445" x2="125" y2="445" stroke="#0969da" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>
    <text x="231" y="433" fill="#0969da" font-size="11" font-weight="700" text-anchor="middle">返回标准 LLM 响应</text>
    <text x="231" y="461" fill="#0284c7" font-size="9" text-anchor="middle">普通 JSON / SSE 流式 (含 reasoning_content)</text>
  </g>

  <!-- 6. Actor Boxes (Top Layer - Clean Light Style) -->

  <!-- Actor 1: LLM Client -->
  <g>
    <rect x="35" y="70" width="180" height="54" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <rect x="35" y="70" width="180" height="6" rx="3" fill="#0969da"/>
    <text x="125" y="96" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">LLM Client</text>
    <text x="125" y="113" fill="#64748b" font-size="8.5" text-anchor="middle">Cherry Studio · ChatBox · RikkaHub</text>
  </g>

  <!-- Actor 2: SotAPI Gateway -->
  <g>
    <rect x="290" y="70" width="170" height="54" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <rect x="290" y="70" width="170" height="6" rx="3" fill="#4f46e5"/>
    <text x="375" y="96" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">SotAPI Gateway</text>
    <text x="375" y="113" fill="#6366f1" font-size="9" font-weight="500" text-anchor="middle">鉴权 · 路由 · 协议适配</text>
  </g>

  <!-- Actor 3: Telegram Bot -->
  <g>
    <rect x="545" y="70" width="160" height="54" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <rect x="545" y="70" width="160" height="6" rx="3" fill="#0284c7"/>
    <text x="625" y="96" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Telegram Channel</text>
    <text x="625" y="113" fill="#64748b" font-size="9" text-anchor="middle">Bot (Polling / Webhook)</text>
  </g>

  <!-- Actor 4: Homo Sapiens / 能工智人 -->
  <g>
    <rect x="795" y="70" width="160" height="54" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#soft-shadow)"/>
    <rect x="795" y="70" width="160" height="6" rx="3" fill="#059669"/>
    <text x="875" y="96" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">能工智人 (Human)</text>
    <text x="875" y="113" fill="#059669" font-size="9" font-weight="500" text-anchor="middle">朋友 / 自己 / 碳基大脑</text>
  </g>

  <!-- 7. Legend Block (Bottom-Right) -->
  <g transform="translate(625, 580)">
    <circle cx="0" cy="0" r="4.5" fill="#0969da"/>
    <text x="9" y="3.5" fill="#64748b" font-size="9">API 消息</text>
    <circle cx="95" cy="0" r="4.5" fill="#059669"/>
    <text x="104" y="3.5" fill="#64748b" font-size="9">智人回复</text>
    <circle cx="200" cy="0" r="4.5" fill="#4f46e5"/>
    <text x="209" y="3.5" fill="#64748b" font-size="9">LLM 响应</text>
    <circle cx="290" cy="0" r="4.5" fill="#64748b"/>
    <text x="299" y="3.5" fill="#64748b" font-size="9">Fallback 降级</text>
  </g>
</svg>
