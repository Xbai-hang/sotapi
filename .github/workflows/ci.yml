name: ci

on:
  push:
    branches:
      - "**"
  pull_request:
  # 手动触发
  workflow_dispatch:
  # 其他工作流调用
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run verification and coverage
        run: make verify
        env:
          # 全仓库代码覆盖率
          COVERAGE_MIN_GLOBAL: ${{ vars.COVERAGE_MIN_GLOBAL || '85' }}
          # 核心代码覆盖率
          COVERAGE_MIN_CORE: ${{ vars.COVERAGE_MIN_CORE || '90' }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Validate runtime and Compose configuration
        env:
          SOTAPI_CONFIG_DIR: ./configs
        run: |
          go run ./cmd/sotapi config validate --config configs/config.example.yaml
          docker compose config --quiet
